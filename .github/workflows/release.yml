name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repackage:
        description: "Publish a packaging-only .N+1 even though this declared state is released"
        type: boolean
        default: false
      reconcile:
        description: "Set by the nightly reconcile backstop"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Record the toolchain
        run: |
          clang --version
          xcodebuild -version

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Version (YYYYMMDD.N) + publish decision
        id: ver
        env:
          REPACKAGE: ${{ inputs.repackage }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          base="$(tr -d '[:space:]' < UPSTREAM_VERSION)"
          maxn=0
          for t in $(git tag --list "$base.*"); do
            n="${t##*.}"
            case "$n" in ''|*[!0-9]*) : ;; *) [ "$n" -gt "$maxn" ] && maxn="$n" ;; esac
          done
          ver="$base.$((maxn + 1))"
          pub=no
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              if [ "$REPACKAGE" = true ]; then
                pub=yes
              else
                digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
                answer="$(sh "$SHIPYARD_SCRIPTS/release-needed.sh" --digest "$digest" --version "$ver")"
                echo "release-needed: $answer"
                if [ "$answer" = PUBLISH ]; then pub=yes; fi
              fi
            fi
          fi
          printf '%s\n' "$ver" > VERSION
          { echo "ver=$ver"; echo "publish=$pub"; } >> "$GITHUB_OUTPUT"
          echo "version=$ver publish=$pub"

      - name: Ensure this runner can run x86_64 (Rosetta)
        run: |
          set -eu
          arch -x86_64 /usr/bin/true 2>/dev/null \
            || sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true

      - name: Build out of tree
        run: echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"

      - name: Build the library
        run: sh build/build-lib.sh

      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      - name: The ingredient pins are declared consistently
        run: sh "$SHIPYARD_SCRIPTS/check-ingredient-pins.sh"

      - name: Build the Sparkle updater (Cocoa/ObjC; must not link the library)
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          B="$MAVERICKS_BUILD_ROOT/updater"
          shipyard-cmake -S . -B "$B" -DCMAKE_OBJC_COMPILER=/usr/bin/clang -DRECAULK_VERSION="$VER" \
            -DCMAKE_TOOLCHAIN_FILE="$SHIPYARD_SCRIPTS/../MavericksToolchain.cmake"
          shipyard-cmake --build "$B" --target recaulk-updater
          bin="$B/recaulk-updater.app/Contents/MacOS/recaulk-updater"
          [ -x "$bin" ] || { echo "::error::no updater binary at $bin"; exit 1; }
          # platform: otool -L's first line is the binary's own path, which contains "recaulk"; skip it
          otool -L "$bin" | sed 1d | tee "$RUNNER_TEMP/updater-otool.txt"
          ! grep -Eq 'librecaulk|libRecaulkSystem' "$RUNNER_TEMP/updater-otool.txt" \
            || { echo "::error::the updater links the library it updates"; exit 1; }

      - name: The updater carries this version
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          plist="$MAVERICKS_BUILD_ROOT/updater/recaulk-updater.app/Contents/Info.plist"
          [ -f "$plist" ] || { echo "::error::no $plist"; exit 1; }
          got="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
          [ "$got" = "$VER" ] || { echo "::error::updater CFBundleVersion $got is not $VER"; exit 1; }

      - name: Package the .pkg
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          pkg="$(UPD_APP="$MAVERICKS_BUILD_ROOT/updater/recaulk-updater.app" VERSION="$VER" sh build/package-pkg.sh)"
          [ -f "$pkg" ] || { echo "::error::package-pkg.sh did not print a pkg path: $pkg"; exit 1; }
          mkdir -p dist
          cp "$pkg" dist/

      - name: Exactly one .pkg, named recaulk-<version>.pkg
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          set -- dist/*.pkg
          [ $# -eq 1 ] && [ "$1" = "dist/recaulk-$VER.pkg" ] \
            || { echo "::error::dist must hold exactly dist/recaulk-$VER.pkg, got: $*"; exit 1; }

      - name: Release notes
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$VER" --version "$VER" \
            --product Recaulk --min-os 10.9.5 --out dist/RELEASE_NOTES.md

      - name: Record the declared state in the notes
        if: steps.ver.outputs.publish == 'yes'
        run: |
          set -eu
          digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
          sh "$SHIPYARD_SCRIPTS/release-state-record.sh" --notes-file dist/RELEASE_NOTES.md --digest "$digest"

      - name: Unsigned stand-in feeds (never published)
        if: steps.ver.outputs.publish != 'yes'
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" dist "$VER"

      - name: EdDSA-sign the .pkg + write recaulk.xml
        if: steps.ver.outputs.publish == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          PKG="dist/recaulk-$VER.pkg"
          [ -f "$PKG" ] || { echo "::error::no $PKG to sign"; exit 1; }
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --product recaulk --feed-dir dist \
            --channel-title "Recaulk for Mavericks" --version "$VER" \
            --pkg-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/$(basename "$PKG")" \
            --notes-file dist/RELEASE_NOTES.md --pkg "$PKG" --min-os 10.9.5

      - name: Artifact conformance
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" dist "$VER" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      - name: The feed is an upgrade on its line
        if: steps.ver.outputs.publish == 'yes'
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          [ -f dist/recaulk.xml ] || { echo "::error::no dist/recaulk.xml"; exit 1; }
          sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast dist/recaulk.xml \
            --version "$VER" --tag-glob '[0-9]*.[0-9]*'

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: recaulk
          path: dist/*

  scan:
    needs: [build]
    if: always() && needs.build.outputs.publish == 'yes' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: recaulk
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  publish:
    needs: [build, scan]
    if: needs.build.outputs.publish == 'yes' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.ver }}
      artifact: recaulk
