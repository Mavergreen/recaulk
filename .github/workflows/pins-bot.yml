name: pins-bot

# platform: a push made with GITHUB_TOKEN starts no workflow, and a run it dispatches does not count for the
#           PR's required check: the push job pushes with a token of the Mavergreen pins-bot GitHub App
#           (org variable PINS_BOT_CLIENT_ID, org secret PINS_BOT_PRIVATE_KEY; contents: write alone), whose
#           push starts release.yml like any push. Its own GITHUB_TOKEN reads only.

on:
  push:
    branches: ['renovate/**']

permissions: {}

concurrency:
  group: pins-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pins: ${{ steps.pin.outputs.pins }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: The tarball pin, if the MacPorts commit moved and the pin is stale
        id: pin
        run: |
          set -eu
          pins="$(sh build/pins-bot.sh fill origin/main)"
          echo "pins=$pins" >> "$GITHUB_OUTPUT"

  push:
    needs: pins
    if: needs.pins.outputs.pins != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: A pins-bot App token, contents write on this repository alone
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PINS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PINS_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Commit the pin to the branch, as the App, which starts release.yml on its new head
        env:
          PINS: ${{ needs.pins.outputs.pins }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          applied="$(sh build/pins-bot.sh apply $PINS)"
          [ "$applied" = changed ] || { echo "the pin file already holds it"; exit 0; }
          git -c user.name='mavergreen-pins-bot[bot]' -c user.email='342268518+mavergreen-pins-bot[bot]@users.noreply.github.com' \
            commit -q -m "chore(pins): the MacPorts tarball's SHA-256" \
            -m 'Written by .github/workflows/pins-bot.yml: its pins job checked, with git, that the tarball is the commit'"'"'s tree.' components/macports-legacy-support/version
          git push origin "HEAD:refs/heads/$BRANCH"
